# Model registry.
#
# Each entry under "models" describes one LLM that the experiment runner can
# instantiate via pear.models.factory.build_llm. The "provider" field selects
# the backend; everything else is forwarded as keyword arguments.
#
# Closed-source providers expect an API key in the .env file (see .env.example).
# Open-source providers run locally and require the optional "open" extras.
#
# The author can pick which entry to use by name from a CLI flag or an
# experiment YAML (e.g.  agents.model: gpt-5.5).

models:

  gpt-5.4-nano-2026-03-17:
    provider: openai
    model: gpt-5.4-nano-2026-03-17
    temperature: 0.2
    max_tokens: 512
    max_tokens_param: max_completion_tokens

  # Local, on-device, Apple Silicon GPU via MLX. This is the Metal path: vLLM
  # has no Metal backend, and its gpu_memory_utilization / tensor_parallel_size
  # knobs are CUDA concepts that do not apply here.
  #
  # 4-bit weights are ~4.3 GB, measured 4.4 GB peak including the KV cache, so
  # it fits a 16 GB machine with headroom. Expect ~8-15 tok/s on an M4; a
  # 5-agent 3-round debate is minutes per example, not seconds.
  #
  # The checkpoint must be MLX-format (the mlx-community repos carry an
  # MLX-specific quantization block). A stock HF checkpoint will not load
  # here -- use provider: hf for those.
  qwen2.5-7b-mlx:
    provider: mlx
    model: mlx-community/Qwen2.5-7B-Instruct-4bit
    temperature: 0.2
    max_tokens: 512
    # max_kv_size: 4096   # uncomment to bound KV memory on long transcripts

  # Local, on-device. Small enough for Apple Silicon unified memory: fp16
  # weights are ~1 GB, so it runs on an M-series laptop with no GPU server and
  # no API cost. Intended for pipeline development and debugging -- at 0.5B the
  # instruction-following is weak, so treat its numbers as smoke-test output,
  # not results.
  #
  # device: mps uses the Metal backend. The model is loaded on CPU and moved,
  # because accelerate's device_map sharding onto "mps" segfaults.
  qwen2.5-0.5b-hf:
    provider: hf
    model: Qwen/Qwen2.5-0.5B-Instruct
    dtype: float16
    device: mps
    temperature: 0.2
    max_new_tokens: 512
    trust_remote_code: false

  # Whitebox entries for the DebUnc baseline (baselines/debunc). It measures
  # confidence from full-vocabulary token probabilities, so it needs
  # provider: hf -- an API backend does not expose them and vLLM does not
  # return them. These two checkpoints are the ones the DebUnc paper
  # evaluates; the harness itself is model-agnostic.
  mistral-7b-instruct-hf:
    provider: hf
    model: mistralai/Mistral-7B-Instruct-v0.2
    dtype: bfloat16
    device: auto
    temperature: 1.0
    max_new_tokens: 1024
    trust_remote_code: false

  llama-3-8b-instruct-hf:
    provider: hf
    model: meta-llama/Meta-Llama-3-8B-Instruct
    dtype: bfloat16
    device: auto
    temperature: 1.0
    max_new_tokens: 1024
    trust_remote_code: false

  claude-haiku-4-5:
    provider: anthropic
    model: claude-haiku-4-5
    temperature: 0.2
    max_tokens: 512


  # vLLM-backed local inference.
  # Use these with scripts/run_*_vllm.sh and the dedicated .venv-vllm env.
  llama-3.1-8b-vllm:
    provider: vllm
    model: /home/dev/hf_cache/imad_models/models--meta-llama--Llama-3.1-8B-Instruct/snapshots/0e9e39f249a16976918f6564b8830bc894c89659
    dtype: bfloat16
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_model_len: 8192
    trust_remote_code: false
    enforce_eager: true
    temperature: 0.2
    max_tokens: 512

  qwen2.5-7b-vllm:
